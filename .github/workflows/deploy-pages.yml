name: Deploy GitHub Pages demo

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static demo artifact
        run: |
          mkdir -p _site/assets/css _site/assets/js
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp assets/css/style.css _site/assets/css/style.css
          cp assets/js/app.js _site/assets/js/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
