services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: network_monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
    volumes:
      - monitor_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d network_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@db:5432/network_monitor
      MONITOR_INTERVAL_SECONDS: 2
      FAILURE_THRESHOLD: 3
      DISABLE_BACKGROUND_MONITOR: "false"
      CORS_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      HELPDESK_INTEGRATION_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  monitor_db:
